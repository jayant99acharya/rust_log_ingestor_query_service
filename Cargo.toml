[package]
name = "log_ingestor_query_service"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "A log ingestor and query service"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
dotenv = "0.15"
log = "0.4"
thiserror = "1.0"
futures = "0.3"

[dev-dependencies]
actix-rt = "2.8"
actix-http = "3.3"
uuid = { version = "1.3", features = ["v4"] }
criterion = "0.4"
rand = "0.8"
test-log = "0.2"
env_logger = "0.10"